# my global config

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# Scrape configurations
scrape_configs:

  # ==========================
  # Prometheus
  # ==========================
  - job_name: "prometheus"

    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"

  # ==========================
  # DeployFlow Node.js App
  # ==========================
  - job_name: "deployflow"

    metrics_path: "/metrics"

    static_configs:
      - targets: ["localhost:3001"]
        labels:
          app: "deployflow"